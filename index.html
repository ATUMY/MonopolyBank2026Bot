<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Монополия Мировая</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:20px;
}


.box{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}


button{
padding:12px;
margin:5px;
border-radius:10px;
border:none;
font-size:16px;
}


input,select{
padding:10px;
font-size:16px;
margin:5px;
}


</style>

</head>


<body>


<h1>🎲 Монополия Мировая</h1>



<div class="box">

<h2>👤 Игрок</h2>

<p id="playerName">
Игрок
</p>


<h2>💰 Баланс</h2>

<h1 id="money">
1500 €
</h1>


<p id="debt">
Долг: 0 €
</p>

</div>



<div class="box">

<input id="amount" type="number" placeholder="Сумма">


<br>


<button onclick="addMoney()">
➕ Получить
</button>


<button onclick="removeMoney()">
➖ Потратить
</button>


</div>



<div class="box">

<button onclick="takeCredit()">
💳 Взять кредит
</button>

</div>



<div class="box" id="bankerBox" style="display:none;">

<h2>🏦 Панель банкира</h2>


<select id="playerSelect">

</select>


<br>


<input id="bankAmount" type="number" placeholder="Сумма">


<br>


<button onclick="giveMoney()">
➕ Выдать игроку
</button>


<button onclick="takePlayerMoney()">
➖ Забрать у игрока
</button>


</div>



<div class="box">

<h2>📜 История</h2>

<p id="history">
Игра начата
</p>

</div>
<script>


let playerName = localStorage.getItem("playerName");


if(!playerName){

playerName = prompt("Введите имя игрока");


if(!playerName){

playerName = "Игрок";

}


localStorage.setItem("playerName", playerName);

}



document.getElementById("playerName").innerHTML =
playerName;



let money = 1500;

let debt = 0;



let players = [

{
name:"Kirill",
money:1500
},

{
name:"Игрок 2",
money:1500
},

{
name:"Игрок 3",
money:1500
}

];



// Если Кирилл — открываем панель банкира

if(playerName === "Kirill"){

document.getElementById("bankerBox").style.display =
"block";


loadPlayers();

}




function update(){


document.getElementById("money").innerHTML =
money + " €";


document.getElementById("debt").innerHTML =
"Долг: " + debt + " €";


}




function addMoney(){

let value =
Number(document.getElementById("amount").value);



money += value;



document.getElementById("history").innerHTML =
"➕ Получено: " + value + " €";



update();

}




function removeMoney(){

let value =
Number(document.getElementById("amount").value);



money -= value;



document.getElementById("history").innerHTML =
"➖ Потрачено: " + value + " €";



update();

}




function takeCredit(){

let value =
Number(prompt("Введите сумму кредита"));


if(value > 0){


money += value;

debt += value;



document.getElementById("history").innerHTML =
"💳 Кредит: +" + value + " €";


update();


}

else{

alert("Неверная сумма");

}


}
function loadPlayers(){

let select =
document.getElementById("playerSelect");


select.innerHTML = "";


players.forEach((player,index)=>{


let option =
document.createElement("option");


option.value = index;


option.textContent =
player.name + " — " + player.money + " €";


select.appendChild(option);


});


}




function giveMoney(){


let index =
document.getElementById("playerSelect").value;


let value =
Number(document.getElementById("bankAmount").value);



players[index].money += value;



document.getElementById("history").innerHTML =
"🏦 Кирилл выдал " +
value +
" € игроку " +
players[index].name;



loadPlayers();


}





function takePlayerMoney(){


let index =
document.getElementById("playerSelect").value;


let value =
Number(document.getElementById("bankAmount").value);



players[index].money -= value;



document.getElementById("history").innerHTML =
"🏦 Кирилл забрал " +
value +
" € у игрока " +
players[index].name;



loadPlayers();


}



</script>


</body>


  </html>
